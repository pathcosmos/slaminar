name: catalog-audit

# Weekly integrity check for catalog/catalog.json. The audit script HEAD-checks
# every GitHub repo, npm package, and PyPI project referenced by a tool entry.
# Catches bit-rot (repos renamed/deleted/archived, packages unpublished) before
# users hit phantom install commands.
#
# Also runs on PRs that touch the catalog so reviewers can see what broke.

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'catalog/catalog.json'
      - 'scripts/verify-catalog.mjs'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run catalog audit
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/verify-catalog.mjs | tee audit.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit-${{ github.run_id }}
          path: |
            catalog-audit.json
            audit.log
          retention-days: 30

      - name: Open or update tracking issue on failure
        if: steps.audit.outputs.exit_code != '0' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('audit.log', 'utf8');
            const title = 'catalog-audit: weekly run detected phantom/broken entries';
            const body = [
              '> Automatically filed by `.github/workflows/catalog-audit.yml`.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              log.slice(-4000),
              '```',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'catalog-audit',
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['catalog-audit', 'bug'],
              });
            }

      - name: Fail job if audit had hard failures
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "Audit exited non-zero — see artifact"
          exit 1
